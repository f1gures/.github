name: Tech Debt
description: Record code or design that works but is costly to maintain, extend or run
type: Tech Debt
projects: ["f1gures/4"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Describe the debt and where it lives, e.g. modules or functions. Link any analysis notes or related issues.
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Impact
      description: Describe the cost of leaving it as is, e.g. bugs it invites, slow requests or extra effort on every change.
    validations:
      required: true
  - type: textarea
    id: proposed-approach
    attributes:
      label: Proposed approach
      description: Outline a fix, if one is known.
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      description: Set these in the sidebar before submitting.
      options:
        - label: "Apply at least one `area:` label"
          required: true
        - label: "Set **Priority**"
          required: true
        - label: "Set **Effort**"
          required: true
        - label: "Set **Task Type**"
          required: true
