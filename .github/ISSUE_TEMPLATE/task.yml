name: Task
description: Plan a specific piece of work, e.g. a build, chore, docs or performance change
type: Task
projects: ["f1gures/4"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Describe the work and why it is needed.
    validations:
      required: true
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      description: List the outcomes that mark this task as done.
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      description: Set these in the sidebar before submitting.
      options:
        - label: "Apply at least one `area:` label"
          required: true
        - label: "Set **Priority**"
          required: true
        - label: "Set **Effort**"
          required: true
        - label: "Set **Task Type**"
          required: true
