name: Bug
description: Report incorrect output or unexpected behaviour
type: Bug
projects: ["f1gures/4"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Describe what went wrong and where, e.g. the page, endpoint or function.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: Describe the correct output or behaviour.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: List the steps, inputs or request payload that trigger the bug. Attach files or screenshots if they help.
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      description: Set these in the sidebar before submitting.
      options:
        - label: "Apply at least one `area:` label"
          required: true
        - label: "Set **Priority**"
          required: true
        - label: "Set **Effort**"
          required: true
